name: Expo Android test build

on:
  workflow_dispatch:
  push:
    branches:
      - app-development
    paths:
      - "mobile-app/**"
      - ".github/workflows/expo-android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android test APK with Expo EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: app-development

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check Expo configuration
        run: npx expo config --type public

      - name: Start Android cloud build
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EAS_TOKEN repository secret. Add an Expo access token in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx eas-cli@latest build --platform android --profile preview --non-interactive
